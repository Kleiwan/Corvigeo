<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Módulo 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

  <!-- NAVBAR: justify-between empurra o logo para a esquerda e o menu para a direita -->
  <div class="navbar bg-blue-900 text-white shadow-sm px-6 lg:px-16 justify-between">
    
    <!-- ESQUERDA: Logo -->
    <div class="flex-none">
      <a class="btn btn-ghost hover:bg-transparent h-auto p-0">
        <img src="img/logo.png" alt="Nobre Piscinas" class="h-14 w-auto object-contain">
      </a>
    </div>

    <!-- DIREITA: Menu e Ícones com espaçamento maior (gap-4 / gap-6) -->
    <div class="flex-none">
      <ul class="menu menu-horizontal text-white items-center gap-3 md:gap-5 uppercase text-xs font-semibold tracking-wider p-0">
        <li>
          <a href="" class="p-1 hover:bg-transparent">
            <img src="img/wtsp.png" alt="WhatsApp" class="h-5 w-5 object-contain">
          </a>
        </li>
        <li>
          <a href="" class="p-1 hover:bg-transparent">
            <img src="img/ig.png" alt="Instagram" class="h-5 w-5 object-contain">
          </a>
        </li>
        <li><a href="" class="hover:bg-blue-800">Sobre</a></li>
        <li><a href="" class="hover:bg-blue-800">Piscinas</a></li>
        <li><a href="" class="hover:bg-blue-800">Orçamentos</a></li>
        <li><a href="" class="hover:bg-blue-800">Garantia</a></li>
        <li><a href="" class="hover:bg-blue-800">Contatos</a></li>
      </ul>
    </div>

  </div>
  <section 
    class="hero min-h-[600px] lg:min-h-[85vh] relative bg-cover bg-center" 
    style="background-image: url('https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?q=80&w=1600&auto=format&fit=crop');"
  >
    <!-- Overlay escuro para dar contraste ao texto branco sobre a imagem -->
    <div class="hero-overlay bg-black/30"></div>
    
    <!-- Container do conteúdo alinhado à esquerda -->
    <div class="hero-content text-left text-white w-full max-w-7xl justify-start px-6 md:px-12">
      <div class="max-w-2xl">
        
        <!-- Título -->
        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold leading-tight drop-shadow">
          <span class="text-amber-500">Experiência no DNA</span> na<br />
          fabricação de piscinas de fibra
        </h1>
        
        <!-- Subtítulo -->
        <p class="py-6 text-base md:text-lg font-light text-slate-100 drop-shadow">
          Uma nova marca que já nasce com 25 anos de história para contar. A Nobre Piscinas possui em seu DNA a experiência de produzir piscinas de fibra de vidro.
        </p>
        
        <!-- Botões -->
        <div class="flex flex-col sm:flex-row gap-4">
          <button class="btn bg-amber-500 hover:bg-amber-600 border-none text-white rounded-md px-8 font-semibold">
            &gt;&gt;&gt; CONHEÇA NOSSA HISTÓRIA
          </button>
          <button class="btn btn-outline border-white text-white hover:bg-white hover:text-blue-950 rounded-md px-8 font-semibold">
            VER PISCINAS
          </button>
        </div>

      </div>
    </div>
  </section>

  <!-- SEÇÃO: CARDS (responsável: integrante C) -->

  <!-- SEÇÃO: FAQ (responsável: integrante D) -->

  <!-- SEÇÃO: FOOTER (responsável: integrante E) -->

</body>
</html>
