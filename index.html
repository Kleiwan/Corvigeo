<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitar Orçamento</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f0f4f8] flex items-center justify-center min-h-screen p-4">

    <div
        class="w-full max-w-[573px] bg-[#233673] text-white rounded-[10px] p-8">

        <div class="text-center mb-8">
            <h2 class="text-xl mb-3">Solicitar orçamento</h2>
            <p class="text-sm opacity-90 max-w-sm mx-auto">
                Preencha os campos abaixo para continuarmos avançando com no seu orçamento.
            </p>
        </div>

        <form class="flex flex-col gap-4">
            <div class="form-control w-full">
                <label class="label pb-1">
                    <span class="label-text text-white text-sm font-medium">Nome</span>
                </label>
                <input type="text" placeholder="Digite seu nome"
                    class="input w-full bg-[#3B4E8C] text-white placeholder:text-white/60 border-none rounded-[5px] focus:outline-none focus:ring-2 focus:ring-orange-400" />
            </div>

            <div class="form-control w-full">
                <label class="label pb-1">
                    <span class="label-text text-white text-sm font-medium">Telefone</span>
                </label>
                <input type="tel" placeholder="Digite um número de telefone"
                    class="input w-full bg-[#3B4E8C] text-white placeholder:text-white/60 border-none rounded-[5px] focus:outline-none focus:ring-2 focus:ring-orange-400" />
            </div>

            <div class="form-control w-full">
                <label class="label pb-1">
                    <span class="label-text text-white text-sm font-medium">E-mail</span>
                </label>
                <input type="email" placeholder="Digite seu e-mail"
                    class="input w-full bg-[#3B4E8C] text-white placeholder:text-white/60 border-none rounded-[5px] focus:outline-none focus:ring-2 focus:ring-orange-400" />
            </div>

            <div class="form-control w-full">
                <label class="label pb-1">
                    <span class="label-text text-white text-sm font-medium">Cidade/UF</span>
                </label>
                <input type="text" placeholder="Digite a cidade e estado de instalação da piscina"
                    class="input w-full bg-[#3B4E8C] text-white placeholder:text-white/60 border-none rounded-[5px] focus:outline-none focus:ring-2 focus:ring-orange-400" />
            </div>

            <button type="submit"
                class="btn w-full bg-[#FF8A3D] text-white border-none rounded-[5px] mt-4 py-3">
                Solicitar Atendimento
            </button>
        </form>

    </div>

</body>

</html>
