<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Módulo 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

  <!-- NAVBAR: justify-between empurra o logo para a esquerda e o menu para a direita -->
  <div class="navbar bg-blue-900 text-white shadow-sm px-6 lg:px-16 justify-between">
    
    <!-- ESQUERDA: Logo -->
    <div class="flex-none">
      <a class="btn btn-ghost hover:bg-transparent h-auto p-0">
        <img src="img/logo.png" alt="Nobre Piscinas" class="h-14 w-auto object-contain">
      </a>
    </div>

    <!-- DIREITA: Menu e Ícones com espaçamento maior (gap-4 / gap-6) -->
    <div class="flex-none">
      <ul class="menu menu-horizontal text-white items-center gap-3 md:gap-5 uppercase text-xs font-semibold tracking-wider p-0">
        <li>
          <a href="" class="p-1 hover:bg-transparent">
            <img src="img/wtsp.png" alt="WhatsApp" class="h-5 w-5 object-contain">
          </a>
        </li>
        <li>
          <a href="" class="p-1 hover:bg-transparent">
            <img src="img/ig.png" alt="Instagram" class="h-5 w-5 object-contain">
          </a>
        </li>
        <li><a href="" class="hover:bg-blue-800">Sobre</a></li>
        <li><a href="" class="hover:bg-blue-800">Piscinas</a></li>
        <li><a href="" class="hover:bg-blue-800">Orçamentos</a></li>
        <li><a href="" class="hover:bg-blue-800">Garantia</a></li>
        <li><a href="" class="hover:bg-blue-800">Contatos</a></li>
      </ul>
    </div>

  </div>

</body>
</html>
