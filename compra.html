<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Importando Tailwind e DaisyUI para o funcionamento das classes enviadas no seu exemplo -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-8 font-['Sora']">
  <div class="collapse collapse-arrow">
    <input type="checkbox"/>
    <div class="collapse-title text-lg font-bold px-0 after:text-[#104F98]">
      Mais informações sobre o produto
    </div>
    <div class="collapse-content px-0 pt-4 border-t">
      <p class="text-sm">
        <strong class="text-[#4D4D4D]">ATENÇÃO:</strong> 
        <span class="text-[#8D9297]">
          A transferência dos pontos comprados para programas parceiros (Milhas) depende da elegibilidade do seu cartão de crédito. Consulte os cartões elegíveis na página do produto a partir do menu Viagens - Programas Parceiros.
        </span>
      </p>
    </div>
  </div>
</body>
</html>
