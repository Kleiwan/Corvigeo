<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="card bg-base-200 border border-base-300 rounded-lg p-6 w-full max-w-4xl shadow-sm font-['Sora]">
    <div class="flex items-center justify-between gap-40">

      <div class="flex-1 w-full flex flex-col items-center text-center sm:text-left space-y-3">
        <span class="block text-sm font-semibold text-base-content/70">
          Quantidade de créditos para compra
        </span>
        <div class="flex items-center justify-center sm:justify-start gap-4">
          <button id="btnMenos" class="btn btn-circle btn-ghost btn-sm text-primary hover:bg-base-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>
          <span id="creditos" class="text-3xl font-bold tracking-tight text-base-content leading-none">
            100
          </span>
          <button id="btnMais" class="btn btn-circle btn-ghost btn-sm text-primary hover:bg-base-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>
        </div>
        <div class="divider"></div>
        <p class="text-xs text-base-content/50">
          Digite o valor aproximado
        </p>
      </div>
      <div class="flex-1 w-full flex flex-col items-center sm:items-start text-center sm:text-left space-y-3 pb-6">
        <span class="block text-sm font-semibold text-base-content/70">
          Total em reais
        </span>
        <div id="total" class="text-3xl font-bold text-base-content leading-none">
          R$ 20.000,00
        </div>
      </div>
    </div>
  </div>
  <script>
    let creditos = 100;
    const valorPorCredito = 200;
    const creditosElemento = document.getElementById("creditos");
    const totalElemento = document.getElementById("total");
    const btnMais = document.getElementById("btnMais");
    const btnMenos = document.getElementById("btnMenos");
    function atualizar() {
      creditosElemento.textContent = creditos;
      const total = creditos * valorPorCredito;
      totalElemento.textContent = total.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }
    btnMais.addEventListener("click", function () {
      creditos += 50;
      atualizar();
    });
    btnMenos.addEventListener("click", function () {
      if (creditos > 50) {
        creditos -= 50;
        atualizar();
      }
    });
  </script>
</body>
</html>
